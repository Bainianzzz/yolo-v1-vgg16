[project]
name = "yolo"
version = "0.1.0"
description = "YOLOv1 with VGG16 backbone trained on COCO8"
requires-python = ">=3.11"
dependencies = [
    "swanlab>=0.4",
    "torch>=2.0,<2.12",
    "torchvision>=0.15,<0.27",
    "tqdm>=4.67.3",
    "ultralytics>=8.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
