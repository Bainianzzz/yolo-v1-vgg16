[project]
name = "yolo"
version = "0.1.0"
description = "YOLOv1 with VGG16 backbone trained on COCO128"
requires-python = ">=3.11"
dependencies = [
    "swanlab>=0.4",
    "torch>=2.0,<2.12",
    "torchvision>=0.15,<0.27",
    "tqdm>=4.67.3",
    "ultralytics>=8.0",
]

# PyTorch CUDA 12.8 (云 GPU 训练) — 本地 CPU 请注释此段
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
